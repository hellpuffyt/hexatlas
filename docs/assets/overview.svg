<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
<title id="t">hexatlas pipeline</title>
<desc id="d">A .hext template is lexed and parsed into a TemplateFile, applied to file bytes by eval::apply to produce FieldValues, which feed the hex view, the JSON encoder and the field-path diff. Bottom: the 33 header bytes of examples/fixtures/a.png and the fields png.hext maps them to.</desc>
